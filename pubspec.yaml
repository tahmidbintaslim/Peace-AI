name: peace_ai
description: An open-source AI application with Al Quran and Hadith knowledge to provide proper responses to user queries.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
    - family: Anek Bangla
      fonts:
        - asset: assets/fonts/AnekBangla-Variable.ttf
    # The web build downloads Roboto from fonts.gstatic.com unless a family
    # of that name is bundled. Pointing the name at the bundled UI font keeps
    # the app free of network calls.
    - family: Roboto
      fonts:
        - asset: assets/fonts/AnekBangla-Variable.ttf
